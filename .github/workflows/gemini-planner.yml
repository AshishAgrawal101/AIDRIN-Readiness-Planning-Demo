name: Run Gemini planner

on:
  workflow_dispatch:
    inputs:
      case:
        description: Synthetic case to try
        type: choice
        default: unclear_target
        options:
          - unclear_target
          - quality
          - renamed_target
          - group_representation
          - privacy_roles_missing
          - hourly_sensor
          - unsupported_calibration
          - image_manifest
          - all
      model:
        description: Gemini model available on your free tier
        type: string
        default: gemini-3.8-flash

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Run offline tests
        run: python -m unittest -v
      - name: Install AIDRIN guidance
        run: python -m pip install --no-deps aidrin==2026.9.1
      - name: Generate and review the plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CASE_ID: ${{ inputs.case }}
          MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Add the GEMINI_API_KEY repository secret under Settings > Secrets and variables > Actions."
            exit 1
          fi
          python gemini_planner.py --case "$CASE_ID" --model "$MODEL" --output-dir output/github-run
      - name: Save the result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gemini-plan-${{ github.run_id }}
          path: |
            output/github-run/suggestions.json
            output/github-run/review.json
          if-no-files-found: ignore
          retention-days: 7
